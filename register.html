<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uông Bí GO · Tạo tài khoản</title>
<link rel="icon" href="favicon.ico" />
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <section class="auth-brand-pane">
    <div style="position:absolute;left:58px;top:50px;right:58px;display:flex;justify-content:space-between;align-items:center;z-index:2;">
      <div class="auth-brand-mark"><span class="seal">UB</span> UÔNG BÍ GO</div>
      <a class="btn btn-gold" href="demo.html">Xem demo giao diện</a>
    </div>

    <div class="auth-brand-copy">
      <div class="eyebrow">Tạo tài khoản · Bắt đầu đặt món</div>
      <h1>Đăng ký,<br/>đặt món.</h1>
      <p>Tạo tài khoản Uông Bí GO để xem thực đơn, thêm món vào giỏ hàng, đặt món và theo dõi đơn hàng của bạn.</p>
    </div>
  </section>

  <section class="auth-form-pane">
    <div class="auth-card">
      <div class="auth-kicker">Uông Bí GO</div>
      <h1>Tạo tài khoản</h1>
      <p class="subtitle">Đăng ký để bắt đầu đặt món tại Uông Bí GO.</p>

      <div id="alertBox"></div>

      <form id="registerForm">
        <div class="field">
          <label>Họ tên</label>
          <input type="text" id="hoTen" required maxlength="100" placeholder="Nguyễn Văn A" autocomplete="name" />
        </div>

        <div class="field">
          <label>Email</label>
          <input type="email" id="email" required maxlength="120" placeholder="ban@uongbigo.vn" autocomplete="email" />
        </div>

        <div class="field">
          <label>Mật khẩu (tối thiểu 6 ký tự)</label>
          <input type="password" id="matKhau" required minlength="6" placeholder="••••••••" autocomplete="new-password" />
        </div>

        <div class="field">
          <label>Vai trò</label>
          <select id="vaiTro">
            <option value="ROLE_BUYER">Sinh viên / Nhân viên (Người mua)</option>
            <option value="ROLE_STAFF">Nhân viên Canteen (KDS)</option>
          </select>
        </div>

        <button type="submit" class="btn btn-primary btn-block" id="btnSubmit">Đăng ký</button>
      </form>

      <p style="text-align:center;margin:16px 0 0;font-size:13px;">
        Đã có tài khoản?
        <a href="index.html" style="color:var(--clr-primary-dark);font-weight:600;">Đăng nhập</a>
      </p>
    </div>
  </section>
</div>

<script src="js/api.js"></script>
<script>
const alertBox = document.getElementById("alertBox");

document.getElementById("registerForm").addEventListener("submit", async (e) => {
  e.preventDefault();

  const btn = document.getElementById("btnSubmit");
  btn.disabled = true;
  btn.textContent = "Đang tạo tài khoản...";
  alertBox.innerHTML = "";

  const payload = {
    hoTen: document.getElementById("hoTen").value.trim(),
    email: document.getElementById("email").value.trim().toLowerCase(),
    matKhau: document.getElementById("matKhau").value,
    vaiTro: document.getElementById("vaiTro").value
  };

  try {
    await apiFetch("/auth/register", {
      method: "POST",
      body: JSON.stringify(payload)
    });

    alertBox.innerHTML =
      '<div class="alert alert-success">Đăng ký thành công! Đang chuyển đến trang đăng nhập...</div>';

    setTimeout(() => goTo("index.html"), 1200);
  } catch (err) {
    alertBox.innerHTML =
      `<div class="alert alert-error">${err.message || "Không thể đăng ký tài khoản."}</div>`;
    btn.disabled = false;
    btn.textContent = "Đăng ký";
  }
});
</script>
</body>
</html>
