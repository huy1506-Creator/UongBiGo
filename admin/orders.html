<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Uông Bí GO · Quản lý đơn hàng</title>
<link rel="icon" href="../favicon.ico" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="admin-layout">
  <aside class="admin-sidebar">
    <div class="brand">Uông Bí GO</div>
    <nav>
      <a href="dashboard.html">📊 Dashboard</a>
      <a href="menu-management.html">🍜 Quản lý món</a>
      <a href="orders.html" class="active">📦 Quản lý đơn</a>
      <a href="../kds.html">👨‍🍳 KDS</a>
    </nav>
    <div class="logout-box">
      <div id="adminName" style="font-size:12px;margin-bottom:10px;"></div>
      <button class="btn btn-outline btn-sm" id="btnLogout">Đăng xuất</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <div class="page-title" style="margin-bottom:4px;">Quản lý đơn hàng</div>
        <p class="page-subtitle" style="margin:0;">Theo dõi tất cả đơn hàng trong hệ thống.</p>
      </div>
      <button class="btn btn-outline" id="btnRefresh">↻ Làm mới</button>
    </div>

    <div id="alertBox"></div>
    <div class="section-card">
      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Đơn hàng</th><th>Thời gian đặt</th><th>Nhận món</th><th>Món</th><th>Tổng tiền</th><th>Trạng thái</th></tr></thead>
          <tbody id="ordersBody"></tbody>
        </table>
      </div>
      <div id="emptyState" class="empty-state hidden">Chưa có đơn hàng.</div>
    </div>
  </main>
</div>

<script src="../js/api.js"></script>
<script>
const user = Auth.requireRole(["ROLE_ADMIN"]);
if (user) {
  document.getElementById("adminName").textContent = user.hoTen;
  document.getElementById("btnLogout").addEventListener("click", () => {
    Auth.clear();
    goTo("index.html");
  });
  loadOrders();
}
document.getElementById("btnRefresh").onclick = loadOrders;

async function loadOrders() {
  try {
    const orders = await apiFetch("/admin/don-hang");
    const body = document.getElementById("ordersBody");
    document.getElementById("emptyState").classList.toggle("hidden", orders.length > 0);
    body.innerHTML = orders.map(o => `
      <tr>
        <td><b>${o.maDonRutGon || "#" + o.maDonHang}</b></td>
        <td>${formatDateTime(o.ngayDat)}</td>
        <td>${formatDateTime(o.thoiGianNhan)}</td>
        <td>${o.chiTietDonHangs.map(i => `${escapeHtml(i.tenMon)} ×${i.soLuong}`).join("<br/>")}</td>
        <td><b>${formatCurrency(o.tongTien)}</b></td>
        <td>${statusPillHtml(o.trangThai)}</td>
      </tr>
    `).join("");
  } catch (err) {
    document.getElementById("alertBox").innerHTML = `<div class="alert alert-error">${err.message}</div>`;
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
</script>
</body>
</html>
